[package]
name = "dualboy"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dualboy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dualboy-web"
path = "src/bin/web_server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
bindgen = "0.69"
cmake = "0.1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
image = "0.24" # For potential frame processing/dumping
once_cell = "1.18"
axum = { version = "0.7", features = ["ws"] }

# The emulation core (libmgba) is already built -O3 by build.rs, but the Rust
# wrapper, the per-frame pixel conversion, and the Tauri/WebView glue were all
# running unoptimized (a 233 MB debug binary with no release build existed).
# opt-level=3 fixes the Rust hot paths; thin LTO + strip shrink the binary
# without the long link times of fat LTO.
[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Keep `cargo test`/dev builds useful: the per-frame pixel loops are the hot
# path and debug opt-level 0 makes them ~10x slower.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2

