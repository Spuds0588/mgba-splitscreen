<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DualBoy</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <!-- Traditional top menu bar. Mouse-driven; game keys never navigate it. -->
    <header class="menubar">
      <span class="brand">DualBoy</span>

      <details class="menu">
        <summary>File</summary>
        <div class="menu-items">
          <button id="load-rom">Load ROM&#8230;</button>
          <button id="export-set">Export All Saves&#8230;</button>
          <button id="import-set">Import All Saves&#8230;</button>
        </div>
      </details>

      <details class="menu">
        <summary>Saves</summary>
        <div class="menu-items" id="save-menu"></div>
      </details>

      <!-- Choose how many linked GBA instances to run (1-4). Changing this
           restarts emulation and reloads the current ROM at the new count. -->
      <details class="menu">
        <summary>Players</summary>
        <div class="menu-items" id="player-menu">
          <button data-players="1">1 Player</button>
          <button data-players="2">2 Players</button>
          <button data-players="3">3 Players</button>
          <button data-players="4">4 Players</button>
        </div>
      </details>

      <details class="menu">
        <summary>Speed</summary>
        <div class="menu-items">
          <button id="toggle-turbo">Turbo (Tab)</button>
          <div class="menu-note">Fast-forward: skips the 60 fps pace so animations play out fast. Toggle with Tab.</div>
        </div>
      </details>

      <details class="menu">
        <summary>Help</summary>
        <div class="menu-items">
          <div class="menu-note">P1: WASD + K/J + L/H + Space/Backspace</div>
          <div class="menu-note">P2: Arrows + M/N + V/B + Enter/O</div>
          <div class="menu-note">P3: T/G/F/R + Y/U + Z/X + 1/2</div>
          <div class="menu-note">P4: I/Q/C/E + P/[ + ,/. + 3/4</div>
        </div>
      </details>

      <span id="status" class="status">Waiting for ROM&#8230;</span>
    </header>

    <!-- Screens fill the rest of the window; grid cells are laid out like a
         video call (2/3/4 equal regions, letterboxed to the GBA 3:2 ratio). -->
    <main id="screens" class="screen-container"></main>

    <!-- Debug overlay: live per-second stats + mGBA WARN/ERROR lines streamed
         from the backend over the WebSocket (text frames). -->
    <div id="overlay" class="overlay"></div>
  </body>
</html>
