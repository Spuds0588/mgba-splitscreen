name: Release beta builds

# Cut a release by tagging a commit with a version tag (e.g. v0.2.0-alpha.1).
# Builds the desktop app bundle (Tauri) on Linux, macOS, and Windows, then
# uploads everything to a GitHub Release marked as a prerelease. A separate
# "release" job creates/updates the Release exactly once (the matrix jobs only
# build + stash artifacts), which avoids the tauri-action create-release 403
# and concurrent-creation races. (The web version needs no release artifacts:
# it's pure WASM served by GitHub Pages.)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os: linux
          - platform: macos-latest
            os: macos
          - platform: windows-latest
            os: windows
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
          librsvg2-dev patchelf libasound2-dev libpulse-dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mgba-splitscreen/src-tauri

      - name: Install npm dependencies
        working-directory: mgba-splitscreen
        run: npm ci

      - name: Build desktop bundle (Tauri)
        working-directory: mgba-splitscreen
        run: npm run tauri build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          if-no-files-found: error
          # Only the installers, NOT `bundle/**`. A recursive glob uploads the
          # unpacked AppImage tree too (its bundled .so files, `copyright`, and
          # the raw executable), which is ~250 files; several then collide by
          # name across the deb/rpm/AppImage trees, and softprops/action-gh-release
          # fails the whole job with "Not Found ... update-a-release-asset" when it
          # tries to update an already-present asset. That is what broke the
          # v0.2.0-alpha.1 and first v0.3.0 releases even though every platform
          # build had succeeded. Patterns that match nothing on a given platform
          # are fine as long as one file is found overall.
          path: |
            mgba-splitscreen/src-tauri/target/release/bundle/deb/*.deb
            mgba-splitscreen/src-tauri/target/release/bundle/rpm/*.rpm
            mgba-splitscreen/src-tauri/target/release/bundle/appimage/*.AppImage
            mgba-splitscreen/src-tauri/target/release/bundle/dmg/*.dmg
            mgba-splitscreen/src-tauri/target/release/bundle/macos/*.app.tar.gz
            mgba-splitscreen/src-tauri/target/release/bundle/msi/*.msi
            mgba-splitscreen/src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create/update release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "mgba-splitscreen ${{ github.ref_name }}"
          body: |
            Prebuilt mgba-splitscreen binaries.

            - **Desktop app** (Linux: .deb/.rpm/.AppImage, macOS: .dmg, Windows: .msi installer)
            - **Web version**: fully in-browser, no install or backend needed —
              https://spuds0588.github.io/mgba-splitscreen/
          prerelease: true
          files: artifacts/**/*
          fail_on_unmatched_files: false
