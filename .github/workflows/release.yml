name: Release beta builds

# Cut a release by tagging a commit with a version tag (e.g. v0.2.0-alpha.1).
# Builds the desktop app bundle (Tauri) plus the standalone web server binary on
# Linux, macOS, and Windows, then uploads everything to a GitHub Release marked
# as a prerelease. A separate "release" job creates/updates the Release exactly
# once (the matrix jobs only build + stash artifacts), which avoids the
# tauri-action create-release 403 and concurrent-creation races.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os: linux
          - platform: macos-latest
            os: macos
          - platform: windows-latest
            os: windows
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
          librsvg2-dev patchelf libasound2-dev libpulse-dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: DualBoy/src-tauri

      - name: Install npm dependencies
        working-directory: DualBoy
        run: npm ci

      - name: Build desktop bundle (Tauri)
        working-directory: DualBoy
        run: npm run tauri build

      - name: Build web server binary (Linux only)
        if: matrix.os == 'linux'
        working-directory: DualBoy/src-tauri
        run: cargo build --release --bin dualboy-web

      - name: Rename web binary
        if: matrix.os == 'linux'
        shell: bash
        run: |
          cd DualBoy/src-tauri/target/release
          mv dualboy-web dualboy-web-linux-x64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          if-no-files-found: error
          path: DualBoy/src-tauri/target/release/bundle/**

      - name: Upload web binary (Linux only)
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: web-linux
          if-no-files-found: error
          path: DualBoy/src-tauri/target/release/dualboy-web-linux-x64

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create/update release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "DualBoy ${{ github.ref_name }}"
          body: |
            Prebuilt DualBoy binaries.

            - **Desktop app** (Linux: .deb/.rpm/.AppImage, macOS: .dmg, Windows: .msi installer)
            - **Web server** (`dualboy-web-<os>-x64`): run it, then open http://127.0.0.1:8080
              to play in a browser. The static UI shell is also on
              https://spuds0588.github.io/mgba-splitscreen/
          prerelease: true
          files: artifacts/**/*
          fail_on_unmatched_files: false
