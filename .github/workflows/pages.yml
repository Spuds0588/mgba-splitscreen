# Publish the DualBoy web UI to GitHub Pages. The page is fully playable in
# the browser: it ships the WASM engine (web/dualboy-web.{js,wasm}) alongside
# the frontend, so no backend is needed.
name: Deploy web UI to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable GitHub Pages (Actions build type) on the first run.
          enablement: true
      - name: Stage frontend + WASM engine
        run: |
          mkdir -p staged
          cp -r DualBoy/src/. staged/
          cp DualBoy/web/dualboy-web.js DualBoy/web/dualboy-web.wasm staged/
      - name: Upload frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: staged
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
